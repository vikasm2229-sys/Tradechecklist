<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Terminal Pro</title>
<style>
:root{--bg:#131722;--pn:#1e222d;--bd:#2a2e39;--tx:#d1d4dc;--mu:#787b86;--hv:#2a2e39;--ac:#2962ff;--up:#089981;--dn:#f23645}
:root[data-theme=light]{--bg:#fff;--pn:#fff;--bd:#e0e3eb;--tx:#131722;--mu:#787b86;--hv:#f0f3fa}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:-1px}
.app{display:grid;height:100%;grid-template-columns:52px 1fr 300px;grid-template-rows:48px 1fr 36px;grid-template-areas:"top top top" "tools chart side" "tools bot side"}
.top{grid-area:top;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--pn);border-bottom:1px solid var(--bd)}
.logo{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;margin-right:6px;flex:none}
.sym{display:flex;align-items:center;gap:6px;background:var(--hv);border-radius:4px;padding:0 10px;height:32px;color:var(--mu);flex:none}
.sym input{background:none;border:0;outline:0;width:100px;font-weight:600;text-transform:uppercase;color:var(--tx)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 6px;flex:none}
.tb,.tfs button,#style{background:none;border:0;border-radius:4px;padding:6px 9px;cursor:pointer;color:var(--tx);flex:none}
.tb:hover,.tfs button:hover,#style:hover{background:var(--hv)}
.tfs{display:flex}.tfs button.on{color:var(--ac);font-weight:600}
#style option{background:var(--pn);color:var(--tx)}
.menu{position:relative;flex:none}
.pop{position:fixed;top:52px;left:8px;z-index:30;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px;min-width:210px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pop label{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:4px;cursor:pointer}
.pop label:hover{background:var(--hv)}
.tools{grid-area:tools;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0}
.tools button{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--mu);cursor:pointer}
.tools button:hover{background:var(--hv);color:var(--tx)}
.tools button.on{background:var(--hv);color:var(--ac)}
.cw{grid-area:chart;position:relative;min-width:0;min-height:0}
#chart,#ov{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none}#ov.act{pointer-events:auto;cursor:crosshair}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:5;background:var(--dn);color:#fff;padding:6px 12px;border-radius:4px;max-width:90%}
#legend{position:absolute;left:12px;top:8px;z-index:3;pointer-events:none;font-size:13px;line-height:1.6}
#legend .t{font-weight:600}
#ohlc span.k{color:var(--mu);margin-right:3px}#ohlc span.v{margin-right:9px}
.bot{grid-area:bot;display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid var(--bd);background:var(--pn);color:var(--mu);font-size:12px;overflow:hidden;white-space:nowrap}
.bot button{background:none;border:0;padding:4px 8px;border-radius:4px;cursor:pointer;color:var(--mu)}
.bot button:hover{background:var(--hv);color:var(--tx)}
.bot a{color:var(--mu);margin-right:10px}.sp{flex:1}#clock{margin-right:10px}
.side{grid-area:side;display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--bd);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;padding:12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);cursor:pointer;font-weight:600}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
#p_wl{overflow:auto;flex:1}
.wh,.row{display:grid;grid-template-columns:1fr 86px 66px;gap:6px;padding:8px 12px;align-items:center}
.wh{color:var(--mu);font-size:12px;border-bottom:1px solid var(--bd)}
.row{width:100%;border:0;background:none;text-align:left;cursor:pointer}
.row:hover,.row.on{background:var(--hv)}
.row span:nth-child(n+2),.wh span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:600}.u{color:var(--up)}.d{color:var(--dn)}
#p_sc{display:flex;flex-direction:column;flex:1;min-height:0}
.opts{padding:8px 12px;display:grid;gap:6px;color:var(--mu)}
.opts label{display:flex;justify-content:space-between;align-items:center}
.opts input[type=number]{width:60px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px}
#code{flex:1;margin:4px 12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none;white-space:pre;min-height:140px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:8px}
.act{display:flex;gap:8px;padding:6px 12px}
.act button{padding:7px 14px;border-radius:4px;border:1px solid var(--bd);background:none;cursor:pointer}
.act button:first-child{background:var(--ac);border-color:var(--ac);color:#fff}
#log{padding:0 12px 10px;color:var(--dn);font-size:12px;min-height:18px}
@media(max-width:820px){
.app{grid-template-columns:1fr;grid-template-rows:48px 44px 58vh 36px auto;grid-template-areas:"top" "tools" "chart" "bot" "side";height:auto;min-height:100%}
.top{overflow-x:auto}
.tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--bd);padding:4px 8px;justify-content:flex-start;overflow-x:auto}
.side{border-left:0;min-height:420px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo" aria-hidden="true">M</div>
    <div class="sym"><svg width='16' height='16' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.6'><circle cx='8.5' cy='8.5' r='5.5'/><path d='M13 13l5 5'/></svg><input id="sym" value="BTCUSDT" list="pairs" autocomplete="off" aria-label="Search symbol"><datalist id="pairs"><option value="BTCUSDT"><option value="ETHUSDT"><option value="BNBUSDT"><option value="SOLUSDT"><option value="XRPUSDT"><option value="DOGEUSDT"><option value="ADAUSDT"><option value="AVAXUSDT"><option value="LINKUSDT"><option value="TRXUSDT"><option value="DOTUSDT"><option value="LTCUSDT"><option value="BCHUSDT"><option value="UNIUSDT"><option value="NEARUSDT"><option value="SUIUSDT"><option value="PEPEUSDT"><option value="SHIBUSDT"><option value="TONUSDT"><option value="ATOMUSDT"></datalist></div>
    <i class="sep"></i>
    <div class="tfs" id="tfs"></div>
    <i class="sep"></i>
    <select id="style" aria-label="Chart style">
      <option value="candles">Candles</option><option value="ha">Heikin Ashi</option>
      <option value="line">Line</option><option value="area">Area</option>
    </select>
    <i class="sep"></i>
    <div class="menu">
      <button class="tb" id="indbtn">Indicators</button>
      <div class="pop" id="indmenu" hidden>
        <label><input type="checkbox" id="i_sma">Moving Average (20)</label>
        <label><input type="checkbox" id="i_ema">EMA (50)</label>
        <label><input type="checkbox" id="i_bb">Bollinger Bands</label>
        <label><input type="checkbox" id="i_vol" checked>Volume</label>
        <label><input type="checkbox" id="i_ng">No Gap Candles</label>
      </div>
    </div>
  </div>
  <div class="tools" id="tools"></div>
  <div class="cw">
    <div id="chart"></div><canvas id="ov"></canvas>
    <div id="toast" hidden></div>
    <div id="legend"><div class="t"><span id="lg_s">BTCUSDT</span> · <span id="lg_tf">1h</span> · Binance</div><div id="ohlc"></div></div>
  </div>
  <div class="bot" id="bot">
    <span id="rg"></span><span class="sp"></span>
    <a href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView Lightweight Charts™</a>
    <span id="clock"></span><button id="theme">Light mode</button>
  </div>
  <div class="side">
    <div class="tabs"><button id="t_wl" class="on">Watchlist</button><button id="t_sc">Script</button></div>
    <div id="p_wl"><div class="wh"><span>Symbol</span><span>Last</span><span>Chg%</span></div><div id="wl"></div></div>
    <div id="p_sc" hidden>
      <div class="opts">
        <label>Apply to day open only <input type="checkbox" id="p_day"></label>
        <label>Hour threshold <input type="number" id="p_thr" value="6"></label>
        <label>Show price line <input type="checkbox" id="p_line" checked></label>
        <label>Hide ticker candles <input type="checkbox" id="hide" checked></label>
      </div>
      <textarea id="code" spellcheck="false" aria-label="Indicator script"></textarea>
      <div class="act"><button id="add">Add to chart</button><button id="rem">Remove</button></div>
      <div id="log"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var PAIRS=["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","TRXUSDT","DOTUSDT","LTCUSDT","BCHUSDT","UNIUSDT","NEARUSDT","SUIUSDT","PEPEUSDT","SHIBUSDT","TONUSDT","ATOMUSDT"];
var TFS=["1m","5m","15m","1h","4h","1d"];
var FIB=[0,.236,.382,.5,.618,.786,1];
var DEFAULT="// No gaps candles (ported from Pine Script)\n// bars = [{time, open, high, low, close, volume}], params = {dayOpenOnly, threshold, showLine}\n// Return { candles: [...], priceLine: true } or { line: [{time, value}] }\nconst out = bars.map((b, i) => {\n  let o = b.open;\n  const hours = i > 0 ? (b.time - bars[i - 1].time) / 3600 : 0;\n  if (i > 0 && (!params.dayOpenOnly || hours > params.threshold)) {\n    o = bars[i - 1].close;\n  }\n  return { time: b.time, open: o, high: b.high, low: b.low, close: b.close };\n});\nreturn { candles: out, priceLine: params.showLine };";
var S={sym:"BTCUSDT",tf:"1h",style:"candles",ng:false,tool:"cur"};
var IND={sma:false,ema:false,bb:false,vol:true};
var UP="#089981",DN="#f23645",TEAL="#089981",RED="#f23645";
var REQ=0,hov=false,bars=[],main=null,ser={},ws=null,draws=[],tmp=null,raf=0,ngT=null,ngPL=null;
$("code").value=DEFAULT;

var chart=LightweightCharts.createChart($("chart"),{
  autoSize:true,
  layout:{background:{color:"#131722"},textColor:"#787b86",fontFamily:"-apple-system,BlinkMacSystemFont,'Trebuchet MS',Roboto,Ubuntu,sans-serif"},
  grid:{vertLines:{color:"#242733"},horzLines:{color:"#242733"}},
  timeScale:{timeVisible:true,borderColor:"#2a2e39"},rightPriceScale:{borderColor:"#2a2e39"}
});
function log(m){$("log").textContent=m||"";var t=$("toast");t.textContent=m||"";t.hidden=!m}
function params(){return{dayOpenOnly:$("p_day").checked,threshold:+$("p_thr").value||0,showLine:$("p_line").checked}}

/* ---------- series helpers ---------- */
function mkMain(){
  if(main)chart.removeSeries(main);
  if(S.style==="line")main=chart.addLineSeries({color:"#2962ff",lineWidth:2});
  else if(S.style==="area")main=chart.addAreaSeries({lineColor:"#2962ff",topColor:"rgba(91,140,255,.35)",bottomColor:"rgba(91,140,255,0)"});
  else main=chart.addCandlestickSeries({upColor:UP,downColor:DN,borderVisible:false,wickUpColor:UP,wickDownColor:DN});
}
function disp(){
  if(S.style==="ha"){var out=[];bars.forEach(function(b,i){var c=(b.open+b.high+b.low+b.close)/4,o=i?(out[i-1].open+out[i-1].close)/2:(b.open+b.close)/2;out.push({time:b.time,open:o,close:c,high:Math.max(b.high,o,c),low:Math.min(b.low,o,c)})});return out}
  if(S.style==="line"||S.style==="area")return bars.map(function(b){return{time:b.time,value:b.close}});
  return bars;
}
function rm(k){if(ser[k]){chart.removeSeries(ser[k]);delete ser[k]}if(k==="ng"){ngT=null;ngPL=null}}
function ln(k,col,data){
  if(!data){rm(k);return}
  if(!ser[k])ser[k]=chart.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  ser[k].setData(data);
}
function sma(n){var o=[],s=0;bars.forEach(function(b,i){s+=b.close;if(i>=n)s-=bars[i-n].close;if(i>=n-1)o.push({time:b.time,value:s/n})});return o}
function ema(n){var o=[],k=2/(n+1),e;bars.forEach(function(b,i){e=i?b.close*k+e*(1-k):b.close;if(i>=n-1)o.push({time:b.time,value:e})});return o}
function bb(n,m){
  var u=[],mi=[],l=[];
  bars.forEach(function(b,i){
    if(i<n-1)return;
    var s=0,v=0,j;
    for(j=i-n+1;j<=i;j++)s+=bars[j].close;
    var a=s/n;
    for(j=i-n+1;j<=i;j++)v+=Math.pow(bars[j].close-a,2);
    var d=Math.sqrt(v/n)*m;
    u.push({time:b.time,value:a+d});mi.push({time:b.time,value:a});l.push({time:b.time,value:a-d});
  });
  return[u,mi,l];
}
function vol(){
  if(!IND.vol){rm("vol");return}
  if(!ser.vol){
    ser.vol=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"v",lastValueVisible:false,priceLineVisible:false});
    chart.priceScale("v").applyOptions({scaleMargins:{top:.85,bottom:0}});
  }
  ser.vol.setData(bars.map(function(b){return{time:b.time,value:b.volume,color:b.close>=b.open?"#08998166":"#f2364566"}}));
}

/* ---------- No Gap Candles / script runner ---------- */
function runScript(){
  log("");
  if(!S.ng){rm("ng");return}
  var res;
  try{res=new Function("bars","params",$("code").value)(bars.map(function(b){return Object.assign({},b)}),params())}
  catch(e){log("Script error: "+e.message);return}
  if(res&&res.candles){
    if(ngT!=="c"){rm("ng");ngT="c";ser.ng=chart.addCandlestickSeries({upColor:TEAL,downColor:RED,borderUpColor:TEAL,borderDownColor:RED,wickUpColor:TEAL,wickDownColor:RED,priceLineVisible:false,lastValueVisible:false})}
    ser.ng.setData(res.candles);
    if(ngPL){ser.ng.removePriceLine(ngPL);ngPL=null}
    var l=res.candles[res.candles.length-1];
    if(res.priceLine&&l)ngPL=ser.ng.createPriceLine({price:l.close,color:l.close>=l.open?TEAL:RED,lineWidth:1,lineStyle:1,axisLabelVisible:true,title:""});
  }else if(res&&res.line){
    if(ngT!=="l"){rm("ng");ngT="l";ser.ng=chart.addLineSeries({color:"#f0b429",lineWidth:2,priceLineVisible:false})}
    ser.ng.setData(res.line);
  }else log("Script must return { candles } or { line }.");
}
function hideMain(){main.applyOptions({visible:!($("hide").checked&&S.ng&&!!ser.ng)})}

function render(){
  if(!bars.length)return;
  main.setData(disp());if(!hov)lg(bars[bars.length-1]);
  ln("sma","#f0b429",IND.sma?sma(20):0);
  ln("ema","#2962ff",IND.ema?ema(50):0);
  var B=IND.bb?bb(20,2):[0,0,0];
  ln("bbu","#a78bfa",B[0]);ln("bbm","#a78bfa88",B[1]);ln("bbl","#a78bfa",B[2]);
  vol();runScript();hideMain();
}
function sched(){if(!raf)raf=requestAnimationFrame(function(){raf=0;render()})}

/* ---------- data ---------- */
var BASES=["https://api.binance.com","https://data-api.binance.vision"];
function get(path,i){
  return fetch(BASES[i]+path).then(function(r){if(!r.ok)throw new Error("bad");return r.json()})
    .catch(function(e){if(i+1<BASES.length)return get(path,i+1);throw e});
}
function load(){
  if(ws){ws.onmessage=null;ws.close();ws=null}
  var s=S.sym,tf=S.tf,rid=++REQ;log("");$("lg_s").textContent=s;$("lg_tf").textContent=tf;
  get("/api/v3/klines?symbol="+s+"&interval="+tf+"&limit=1000",0).then(function(rows){
    if(rid!==REQ)return;
    bars=rows.map(function(k){return{time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}});
    render();chart.timeScale().fitContent();
    ws=new WebSocket("wss://stream.binance.com:9443/ws/"+s.toLowerCase()+"@kline_"+tf);
    ws.onmessage=function(ev){
      var k=JSON.parse(ev.data).k,b={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v},l=bars[bars.length-1];
      if(l&&l.time===b.time)bars[bars.length-1]=b;else bars.push(b);
      sched();
    };
  }).catch(function(){if(rid===REQ)log("Could not load "+s+" from Binance. Check the symbol (e.g. ETHUSDT).")});
  Array.prototype.forEach.call($("wl").children,function(r){r.className="row"+(r.dataset.s===s?" on":"")});
}
chart.subscribeCrosshairMove(function(p){
  var t=p.time,b=null;
  if(t){for(var i=bars.length-1;i>=0;i--)if(bars[i].time===t){b=bars[i];break}}
  hov=!!b;lg(b||bars[bars.length-1]);
});

/* ---------- drawing tools ---------- */
var cv=$("ov"),cx=cv.getContext("2d"),TOOLS=[["cur","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M5 3l10 6-4.5 1.2L8.5 15z'/></svg>","Cursor"],["t","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 15L16 5'/><circle cx='4' cy='15' r='1.6'/><circle cx='16' cy='5' r='1.6'/></svg>","Trendline"],["h","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M2 10h16'/><circle cx='10' cy='10' r='1.6'/></svg>","Horizontal line"],["r","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='4' y='5' width='12' height='10'/></svg>","Rectangle"],["f","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 4h14M3 8h14M3 12h14M3 16h14'/></svg>","Fibonacci retracement"],["x","<svg width='20' height='20' viewBox='0 0 20 20' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M5 6h10M8 6V4h4v2M6 6l1 10h6l1-10'/></svg>","Clear drawings"]];
function setTool(t){
  S.tool=t;cv.className=t==="cur"?"":"act";
  Array.prototype.forEach.call($("tools").children,function(b){b.className=b.dataset.t===t?"on":""});
}
TOOLS.forEach(function(t){
  var b=document.createElement("button");b.innerHTML=t[1];b.title=t[2];b.setAttribute("aria-label",t[2]);b.dataset.t=t[0];
  b.onclick=function(){if(t[0]==="x"){draws=[];setTool("cur")}else setTool(t[0])};
  $("tools").appendChild(b);
});
function pt(e){
  var r=cv.getBoundingClientRect(),t=chart.timeScale().coordinateToTime(e.clientX-r.left),p=main.coordinateToPrice(e.clientY-r.top);
  return t==null||p==null?null:{t:t,p:p};
}
cv.onpointerdown=function(e){
  var q=pt(e);if(!q)return;
  if(S.tool==="h"){draws.push({k:"h",a:q});setTool("cur");return}
  tmp={k:S.tool,a:q,b:q};cv.setPointerCapture(e.pointerId);
};
cv.onpointermove=function(e){if(tmp){var q=pt(e);if(q)tmp.b=q}};
cv.onpointerup=function(){if(tmp){draws.push(tmp);tmp=null;setTool("cur")}};
function xy(p){return{x:chart.timeScale().timeToCoordinate(p.t),y:main.priceToCoordinate(p.p)}}
function seg(x1,y1,x2,y2){cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke()}
function paint(){
  var dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
  cx.strokeStyle="#2962ff";cx.fillStyle="#2962ff";cx.lineWidth=1.5;cx.font="11px system-ui,sans-serif";
  draws.concat(tmp?[tmp]:[]).forEach(function(d){
    var a=xy(d.a),b=d.b?xy(d.b):null;
    if(a.y==null)return;
    if(d.k==="h"){seg(0,a.y,w,a.y);cx.fillText(d.a.p.toFixed(2),6,a.y-4);return}
    if(a.x==null||!b||b.x==null||b.y==null)return;
    if(d.k==="t")seg(a.x,a.y,b.x,b.y);
    else if(d.k==="r"){cx.globalAlpha=.12;cx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);cx.globalAlpha=1;cx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}
    else if(d.k==="f"){
      var x0=Math.min(a.x,b.x);
      FIB.forEach(function(lv){
        var p=d.b.p+(d.a.p-d.b.p)*lv,y=main.priceToCoordinate(p);
        if(y==null)return;
        cx.globalAlpha=.8;seg(x0,y,w,y);cx.globalAlpha=1;cx.fillText(lv+"  ("+p.toFixed(2)+")",x0+4,y-3);
      });
    }
  });
  requestAnimationFrame(paint);
}

/* ---------- UI wiring ---------- */
TFS.forEach(function(t){
  var b=document.createElement("button");b.textContent=t;b.className=t===S.tf?"on":"";
  b.onclick=function(){S.tf=t;Array.prototype.forEach.call($("tfs").children,function(x){x.className=x.textContent===t?"on":""});load()};
  $("tfs").appendChild(b);
});
function norm(v){
  v=v.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!v)return"BTCUSDT";
  if(/(USDT|USDC|FDUSD|BUSD)$/.test(v))return v;
  if(/USD$/.test(v))return v+"T";
  if(v.length>4&&/(BTC|ETH|BNB)$/.test(v))return v;
  return v+"USDT";
}
function go(){S.sym=norm($("sym").value);$("sym").value=S.sym;load()}
$("sym").onkeydown=function(e){if(e.key==="Enter")go()};
$("sym").onchange=go;
$("style").onchange=function(){S.style=this.value;mkMain();render()};
[["i_sma","sma"],["i_ema","ema"],["i_bb","bb"],["i_vol","vol"]].forEach(function(x){$(x[0]).onchange=function(){IND[x[1]]=this.checked;render()}});
$("add").onclick=function(){S.ng=true;$("i_ng").checked=true;render()};
$("rem").onclick=function(){S.ng=false;$("i_ng").checked=false;rm("ng");hideMain();log("")};
["p_day","p_thr","p_line","hide"].forEach(function(id){$(id).onchange=render});

/* watchlist */
function fp(p){return p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6)}
PAIRS.forEach(function(p){
  var b=document.createElement("button");b.className="row";b.dataset.s=p;
  b.innerHTML="<span class='nm'>"+p+"</span><span id='w_"+p+"'>–</span><span id='c_"+p+"'>–</span>";
  b.onclick=function(){S.sym=p;$("sym").value=p;load()};
  $("wl").appendChild(b);
});
try{
  var wlws=new WebSocket("wss://stream.binance.com:9443/stream?streams="+PAIRS.map(function(p){return p.toLowerCase()+"@miniTicker"}).join("/"));
  wlws.onmessage=function(e){
    var d=JSON.parse(e.data).data,el=$("w_"+d.s);if(!el)return;
    var c=+d.c,ch=(c/+d.o-1)*100;
    el.textContent=fp(c);var ce=$("c_"+d.s);ce.className=ch>=0?"u":"d";ce.textContent=(ch>=0?"+":"")+ch.toFixed(2)+"%";
  };
}catch(e){}


function lg(b){
  if(!b)return;
  var c=b.close>=b.open?"#089981":"#f23645",ch=b.close-b.open,pc=ch/b.open*100;
  function v(k,x){return"<span class='k'>"+k+"</span><span class='v' style='color:"+c+"'>"+fp(x)+"</span>"}
  $("ohlc").innerHTML=v("O",b.open)+v("H",b.high)+v("L",b.low)+v("C",b.close)+"<span class='v' style='color:"+c+"'>"+(ch>=0?"+":"")+fp(ch)+" ("+(ch>=0?"+":"")+pc.toFixed(2)+"%)</span>";
}
var TH={dark:{bg:"#131722",gr:"#242733",bd:"#2a2e39"},light:{bg:"#ffffff",gr:"#f0f3fa",bd:"#e0e3eb"}};
function theme(n){
  document.documentElement.dataset.theme=n;var t=TH[n];
  chart.applyOptions({layout:{background:{color:t.bg},textColor:"#787b86"},grid:{vertLines:{color:t.gr},horzLines:{color:t.gr}},timeScale:{borderColor:t.bd},rightPriceScale:{borderColor:t.bd}});
  $("theme").textContent=n==="dark"?"Light mode":"Dark mode";
}
$("theme").onclick=function(){theme(document.documentElement.dataset.theme==="light"?"dark":"light")};
$("indbtn").onclick=function(e){e.stopPropagation();var m=$("indmenu"),r=this.getBoundingClientRect();m.style.left=Math.max(4,r.left)+"px";m.style.top=(r.bottom+4)+"px";m.hidden=!m.hidden};
document.addEventListener("click",function(e){if(!e.target.closest(".menu"))$("indmenu").hidden=true});
$("i_ng").onchange=function(){S.ng=this.checked;render()};
function tab(w){$("p_wl").hidden=w!=="wl";$("p_sc").hidden=w!=="sc";$("t_wl").className=w==="wl"?"on":"";$("t_sc").className=w==="sc"?"on":""}
$("t_wl").onclick=function(){tab("wl")};$("t_sc").onclick=function(){tab("sc")};
[["1D",86400],["5D",432000],["1M",2592000],["3M",7776000],["6M",15552000],["1Y",31536000],["All",0]].forEach(function(r){
  var b=document.createElement("button");b.textContent=r[0];
  b.onclick=function(){
    if(!r[1]||!bars.length){chart.timeScale().fitContent();return}
    var to=bars[bars.length-1].time;
    chart.timeScale().setVisibleRange({from:Math.max(bars[0].time,to-r[1]),to:to});
  };
  $("rg").appendChild(b);
});
setInterval(function(){$("clock").textContent=new Date().toISOString().slice(11,19)+" UTC"},1000);
theme("dark");
mkMain();load();paint();
})();
</script>
